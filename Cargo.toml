[package]
name = "rpc-swarm"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP server/client
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client", "http1", "http2"] }
http-body-util = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for health checks
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
